# Local development services. Not for production.
name: lumio
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lumio
      # Dev-only default; override with POSTGRES_PASSWORD in your shell or a .env next to this file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumio_dev}
      POSTGRES_DB: lumio
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - lumio-pg:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumio -d lumio"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  lumio-pg:
