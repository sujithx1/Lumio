<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-label="An effect flies from a phone to a laptop and bursts on its screen">
  <!-- README hero: one Lumio handoff, looping. SMIL only (no CSS), so it animates inside GitHub's <img>. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1546"/>
      <stop offset="0.55" stop-color="#110d2e"/>
      <stop offset="1" stop-color="#07080c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" gradientUnits="userSpaceOnUse" x1="200" y1="90" x2="720" y2="150">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="arc" d="M160 92 C 300 -10, 560 0, 720 150"/>
    <path id="star" d="M0 -16 Q2 -2 16 0 Q2 2 0 16 Q-2 2 -16 0 Q-2 -2 0 -16Z"/>
  </defs>

  <rect width="960" height="320" rx="24" fill="url(#bg)"/>

  <!-- twinkling background stars -->
  <g fill="#ffffff">
    <circle cx="70" cy="40" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="250" r="1.4"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="34" r="1.8"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="905" cy="36" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="286" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="290" r="1.6"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- phone -->
  <g>
    <rect x="110" y="84" width="104" height="196" rx="20" fill="#0d0f1a" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="148" y="94" width="28" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.18"/>
    <!-- the effect card flicked up -->
    <g>
      <rect x="132" y="170" width="60" height="78" rx="10" fill="#7c5cff" fill-opacity="0.85"/>
      <use href="#star" transform="translate(162 205) scale(0.8)" fill="#ffffff"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -60;0 -60;0 0" keyTimes="0;0.04;0.12;0.99;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.06;0.12;0.94;1" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- laptop -->
  <g>
    <rect x="560" y="56" width="320" height="204" rx="14" fill="#0d0f1a" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="574" y="70" width="292" height="176" rx="6" fill="#121633"/>
    <rect x="574" y="70" width="292" height="176" rx="6" fill="#7c5cff" opacity="0">
      <animate attributeName="opacity" values="0;0;0.4;0;0" keyTimes="0;0.5;0.53;0.7;1" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <path d="M530 262 H910 L888 282 H552 Z" fill="#1b1f33" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/>
    <!-- "from iPhone" pill -->
    <g opacity="0">
      <rect x="742" y="84" width="112" height="26" rx="13" fill="#2b2fa8" fill-opacity="0.85"/>
      <text x="798" y="101.5" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#ffffff">from iPhone</text>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.55;0.9;0.96;1" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- comet trail -->
  <path d="M160 92 C 300 -10, 560 0, 720 150" fill="none" stroke="url(#trail)" stroke-width="10" stroke-linecap="round" pathLength="1" stroke-dasharray="0.3 2" filter="url(#bloom)" opacity="0">
    <animate attributeName="stroke-dashoffset" values="0.3;0.3;-0.7;-1;-1" keyTimes="0;0.11;0.5;0.58;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.13;0.5;0.6;1" dur="3.6s" repeatCount="indefinite"/>
  </path>
  <path d="M160 92 C 300 -10, 560 0, 720 150" fill="none" stroke="url(#trail)" stroke-width="4" stroke-linecap="round" pathLength="1" stroke-dasharray="0.3 2" opacity="0">
    <animate attributeName="stroke-dashoffset" values="0.3;0.3;-0.7;-1;-1" keyTimes="0;0.11;0.5;0.58;1" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.13;0.5;0.6;1" dur="3.6s" repeatCount="indefinite"/>
  </path>

  <!-- comet head -->
  <g opacity="0">
    <circle r="26" fill="url(#glow)"/>
    <use href="#star" fill="#ffffff"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.11;0.5;1" calcMode="linear">
      <mpath href="#arc"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1;0.12;0.49;0.51;1" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <!-- arrival burst -->
  <g transform="translate(720 158)">
    <circle r="10" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0">
      <animate attributeName="r" values="10;10;120;120" keyTimes="0;0.5;0.72;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.5;0.51;0.72;1" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <g fill="#ffffff" opacity="0">
      <use href="#star" transform="translate(-70 -40) scale(0.45)"/>
      <use href="#star" transform="translate(80 -30) scale(0.55)"/>
      <use href="#star" transform="translate(-50 55) scale(0.4)"/>
      <use href="#star" transform="translate(60 50) scale(0.5)"/>
      <use href="#star" transform="translate(0 -70) scale(0.35)"/>
      <use href="#star" transform="scale(1.2)"/>
      <animateTransform attributeName="transform" type="scale" values="0.3;0.3;1.15;1.15" keyTimes="0;0.5;0.66;1" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5;0.52;0.8;0.92;1" dur="3.6s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
