[package]
name = "lumio-desktop"
version = "0.1.0"
description = "Lumio desktop: send and receive visual effects between your devices"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows (cargo#8519).
name = "lumio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
gethostname = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
ed25519-dalek = "2"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v7"] }
qrcode = { version = "0.14", default-features = false }
url = "2"
sha2 = "0.10"
bytes = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
